apiVersion: apps/v1
kind: Deployment
metadata:
  name: dca-router
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dca-router
  template:
    metadata:
      labels:
        app: dca-router
    spec:
      containers:
      - name: router
        image: dca-01-router:latest
        ports:
        - containerPort: 8000
        env:
        - name: ROUTER_ID
          value: "router_a"